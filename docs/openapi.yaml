openapi: 3.1.0
info:
  title: Luma Card Event Router API
  version: 1.1.0
  description: Read-only, token-authenticated event catalog for indexed integrations.
servers:
  - url: https://your-luma-card-deployment.example
security:
  - bearerAuth: []
paths:
  /api/v1/calendars:
    get:
      operationId: listCalendars
      responses:
        "200":
          description: Active calendars and sync metadata.
  /api/v1/events:
    get:
      operationId: listEvents
      parameters:
        - { $ref: "#/components/parameters/Calendar" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: provider, in: query, schema: { type: string, enum: [luma, eventbrite, meetup] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: country, in: query, schema: { type: string, example: PE } }
        - { name: city, in: query, schema: { type: string } }
        - { name: language, in: query, schema: { type: string, example: es-PE } }
        - { name: online, in: query, schema: { type: boolean } }
        - { name: format, in: query, schema: { type: string } }
        - { name: topic, in: query, schema: { type: string } }
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [all, upcoming, ongoing, past], default: all },
          }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: Paginated canonical or source events. }
        "400": { $ref: "#/components/responses/BadParams" }
  /api/v1/events/changes:
    get:
      operationId: listEventChanges
      parameters:
        - { name: since, in: query, schema: { type: string, default: "0" } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: Upserts and delete tombstones since the cursor. }
  /api/v1/events/{canonicalId}:
    get:
      operationId: getEvent
      parameters:
        - { name: canonicalId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: One canonical event. }
        "404": { description: Event not found. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: luma_sk
  parameters:
    Calendar:
      name: calendar
      in: query
      schema: { type: string, default: all }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    BadParams:
      description: Invalid query parameters.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error, message, requestId]
      properties:
        error: { type: string }
        message: { type: string }
        requestId: { type: string }
        details: { type: object, additionalProperties: true }
